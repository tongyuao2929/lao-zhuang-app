<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f7f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>老庄</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f3ec;--paper:#fffdf8;--panel:#f0eadf;--text:#25221d;--muted:#756e63;
  --accent:#8f2f20;--accent2:#1e6f68;--line:#ded3c4;--soft:#f9f6ef;
  --shadow:0 14px 40px rgba(61,45,28,.08);--radius:8px;--nav:rgba(247,243,236,.9)
}
body.dark{
  --bg:#171817;--paper:#22231f;--panel:#2d2c26;--text:#e9e0d1;--muted:#aaa08f;
  --accent:#d86d59;--accent2:#7fc9ba;--line:#3c3a34;--soft:#1d1e1b;
  --shadow:0 16px 44px rgba(0,0,0,.28);--nav:rgba(23,24,23,.92)
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
button,select,input{font:inherit}
button{color:inherit;line-height:1.2;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid color-mix(in srgb,var(--accent),transparent 12%);outline-offset:2px}
.ui-icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 18px;background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line),transparent 25%)}
.header-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:2px}
.mini-taiji{width:26px;height:26px;display:block;flex:0 0 auto;color:var(--text);filter:drop-shadow(0 4px 9px rgba(0,0,0,.08))}
.mini-taiji .taiji-light{fill:var(--paper)}
.mini-taiji .taiji-dark{fill:var(--text)}
.mini-taiji .taiji-ring{fill:none;stroke:var(--text)}
.header-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:999px;background:var(--paper);display:grid;place-items:center;cursor:pointer;transition:border-color .18s,color .18s,background .18s,transform .18s;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--soft);transform:translateY(-1px)}
.icon-btn:active{transform:translateY(0)}
#app{max-width:980px;margin:0 auto;padding:24px 18px 24px;min-height:calc(100vh - 58px)}
.page{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:25px;font-weight:750;letter-spacing:1px}
.page-sub{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.6}
.home-page{position:relative;overflow:hidden}
.hero-section{display:grid;place-items:center;text-align:center;padding:36px 0 22px}
.brand-mark{width:88px;height:88px;display:grid;place-items:center;margin-bottom:18px;border-radius:26px;background:var(--paper);box-shadow:0 18px 45px rgba(61,45,28,.1);border:1px solid var(--line)}
.brand-mark svg{width:78px;height:78px}
.app-title{font-size:48px;font-weight:300;letter-spacing:14px;color:var(--accent);line-height:1;margin-left:14px}
.app-subtitle{font-size:14px;color:var(--muted);letter-spacing:2px;margin-top:14px}
.daily-card{display:block;width:100%;max-width:760px;margin:0 auto 18px;padding:24px 28px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);border-radius:var(--radius);color:var(--text);text-align:left;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.daily-card:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent2) 45%,var(--line));box-shadow:0 18px 46px rgba(61,45,28,.11)}
.daily-label{font-size:12px;color:var(--accent2);font-weight:700;letter-spacing:2px;margin-bottom:10px}
.daily-text{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:22px;line-height:1.75}
.daily-source{font-size:13px;color:var(--muted);margin-top:8px;text-align:right}
.stat-strip{max-width:760px;margin:0 auto 18px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--radius);background:var(--soft);overflow:hidden}
.stat-strip button{appearance:none;text-align:left;border:0;border-right:1px solid var(--line);background:transparent;min-height:68px;padding:14px 16px;cursor:pointer;transition:background .16s,color .16s;display:flex;flex-direction:column;justify-content:center;gap:4px}
.stat-strip button:last-child{border-right:none}
.stat-strip button:hover{background:var(--paper);color:var(--accent)}
.stat-strip button:focus-visible{outline-offset:-2px}
.stat-strip strong{display:block;font-size:14px;color:var(--accent);line-height:1.25}
.stat-strip span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.home-search-entry{max-width:760px;margin:0 auto 18px}
.home-search-entry button{width:100%;min-height:54px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:0 8px 24px rgba(61,45,28,.04);display:grid;grid-template-columns:36px auto 1fr;gap:10px;align-items:center;text-align:left;cursor:pointer;transition:border-color .16s,background .16s,transform .16s,box-shadow .16s}
.home-search-entry button:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-1px);box-shadow:0 12px 28px rgba(61,45,28,.07)}
.home-search-entry button:active{transform:translateY(0)}
.home-search-icon{width:36px;height:36px;border:1px solid var(--line);border-radius:999px;display:grid;place-items:center;color:var(--accent);background:var(--soft)}
.home-search-entry strong{font-size:14px;color:var(--accent);white-space:nowrap}
.home-search-entry button>span:last-child{font-size:13px;color:var(--muted);line-height:1.45}
.reader-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
.reader-tools label{display:inline-flex;align-items:center;gap:7px;min-height:38px;color:var(--muted);font-size:12px;font-weight:750;line-height:1}
.reader-tools label>span:first-child{display:inline-flex;align-items:center;height:38px;white-space:nowrap}
.check-tool{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;transition:border-color .16s,background .16s;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.check-tool:hover{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.check-tool input{accent-color:var(--accent)}
.vs{height:38px;min-width:86px;padding:0 31px 0 11px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(45deg,transparent 50%,var(--muted) 50%) right 13px center/6px 6px no-repeat,linear-gradient(135deg,var(--muted) 50%,transparent 50%) right 9px center/6px 6px no-repeat,var(--paper);color:var(--text);outline:none;cursor:pointer;appearance:none;line-height:38px;transition:border-color .16s,background-color .16s,box-shadow .16s}
.vs:hover,.vs:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 88%)}
.chapter-list,.zz-group{display:grid;gap:8px}
.zz-group{margin-bottom:18px}
.section-title{font-size:14px;color:var(--accent2);letter-spacing:2px;margin:14px 0 2px}
.chapter-item{width:100%;min-height:60px;text-align:left;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);display:grid;grid-template-columns:minmax(76px,auto) minmax(0,1fr) 28px;grid-template-rows:auto auto;column-gap:12px;row-gap:4px;align-items:center;padding:13px 14px;cursor:pointer;transition:border-color .16s,box-shadow .16s,transform .16s,background .16s}
.chapter-item:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(61,45,28,.06);transform:translateY(-1px)}
.chapter-item:active{transform:translateY(0)}
.ch-num{grid-row:1/3;font-weight:750;color:var(--accent);white-space:nowrap;align-self:center;line-height:1.25}
.ch-preview{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35;align-self:end}
.chapter-item.no-meta .ch-preview{grid-row:1/3;align-self:center}
.ch-meta{grid-column:2/3;font-size:11px;color:var(--accent2);line-height:1.25}
.row-go{color:var(--muted);display:grid;place-items:center}
.chapter-item .row-go{grid-column:3;grid-row:1/3;align-self:center;justify-self:end;width:28px;height:28px;border-radius:999px;background:var(--soft);transition:background .16s,color .16s,transform .16s}
.chapter-item:hover .row-go{background:var(--accent);color:#fff;transform:translateX(1px)}
.back-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:38px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;color:var(--accent);font-weight:750;white-space:nowrap;transition:border-color .16s,background .16s,transform .16s}
.back-btn:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-1px)}
.back-btn:active{transform:translateY(0)}
.back-btn .ui-icon{width:18px;height:18px}
.chapter-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.chapter-nav button{height:42px;min-width:112px;padding:0 17px;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;color:var(--accent);font-weight:750;display:inline-flex;align-items:center;justify-content:center;text-align:center;transition:border-color .16s,background .16s,transform .16s}
.chapter-nav button:hover:not(:disabled){border-color:var(--accent);background:var(--soft);transform:translateY(-1px)}
.chapter-nav button:active:not(:disabled){transform:translateY(0)}
.chapter-nav button:disabled{opacity:.38;cursor:not-allowed;color:var(--muted)}
.reader-shell{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;max-width:820px;margin:0 auto}
.reader-size-small .detail-text{font-size:16px;line-height:1.95}
.reader-size-small .translation-bd,.reader-size-small .annot-bd{font-size:13px}
.reader-size-large .detail-text{font-size:21px;line-height:2.15}
.reader-size-large .translation-bd,.reader-size-large .annot-bd{font-size:16px}
.reader-head{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.kicker{font-size:12px;color:var(--accent2);font-weight:700;letter-spacing:2px;margin-bottom:8px}
.detail-title{font-size:28px;font-weight:650;color:var(--accent);letter-spacing:1px}
.commentator-card{margin:14px 0 0;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--soft)}
.commentator-card div{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.commentator-card strong{font-size:15px;color:var(--accent)}
.commentator-card span{font-size:12px;color:var(--accent2);font-weight:700}
.commentator-card p{font-size:13px;line-height:1.7;color:var(--muted)}
.original-panel{padding:12px 0 4px}
.panel-label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:2px;margin:4px 0 2px}
.detail-text{font-family:"Songti SC","Noto Serif SC","STSong",Georgia,serif;font-size:18px;line-height:2.05;text-align:justify;margin:12px 0}
.detail-text.passage{margin:4px 0 10px}
.passage-block{position:relative;padding:16px 0;border-bottom:1px solid var(--line)}
.passage-block:last-child{border-bottom:none}
.passage-num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;width:max-content;max-width:100%;box-sizing:border-box;padding:0 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--soft)}
.translation-group{padding:4px 0 18px;border-bottom:1px solid var(--line)}
.translation-group>.passage-block{border-bottom:none;padding:12px 0}
.translation-group .translation-card{margin-top:2px}
.passage-note-stack{margin-top:10px}
.translation-card,.annot-card,.empty-note{margin:12px 0;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:var(--radius)}
.appendix-note{margin-top:20px;background:var(--paper)}
.annot-card summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.annot-card summary::-webkit-details-marker{display:none}
.annot-card summary:after{content:"收合";justify-self:end;font-size:12px;color:var(--muted);font-weight:600;line-height:1}
.annot-card:not([open]) summary:after{content:"展开"}
.annot-card:not([open]){padding-bottom:12px}
.annot-card summary .annot-hd{min-width:0;margin-bottom:0}
.translation-hd,.annot-hd{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:8px}
.annot-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.annot-hd span{color:var(--muted);font-weight:600;letter-spacing:0}
.translation-bd,.annot-bd,.empty-note p{font-size:14px;line-height:1.9;color:var(--text)}
.annot-bd{margin-top:10px}
.annot-line{margin:7px 0}
.source-note{font-size:12px;color:var(--muted);line-height:1.7;margin:-2px 0 10px}
.empty-note strong{color:var(--accent)}
.concept-search{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin:0 0 12px}
.concept-search input{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--text);outline:none}
.concept-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 86%)}
.concept-search span{min-width:72px;height:34px;display:inline-flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--muted);padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--soft)}
.concepts-page .segmented{position:sticky;top:58px;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;background:var(--bg);scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent),transparent 35%) transparent}
.concepts-page .segmented::-webkit-scrollbar{height:4px}
.concepts-page .segmented::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent),transparent 35%);border-radius:999px}
.segmented button{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;color:var(--muted);font-weight:750;transition:border-color .16s,background .16s,color .16s,transform .16s}
.segmented button:hover{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.segmented button small{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:color-mix(in srgb,var(--line),transparent 35%);font-size:11px;color:inherit;opacity:.82;line-height:1}
.segmented button.active{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent),transparent 78%)}
.segmented button.active small{background:rgba(255,255,255,.18)}
.concept-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.concept-card{appearance:none;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 8px 24px rgba(61,45,28,.04);cursor:pointer;transition:border-color .16s,transform .16s,box-shadow .16s}
.concept-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.concept-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.concept-cat{font-size:11px;color:var(--accent2);font-weight:800;letter-spacing:2px;margin-bottom:8px}
.concept-card h3{font-size:20px;color:var(--accent);margin-bottom:8px}
.concept-card p{font-size:14px;line-height:1.82;color:var(--muted)}
.related-panel{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.related-list{display:grid;gap:8px}
.lineage-intro p,.lineage-note p{font-size:15px;line-height:1.9;color:var(--text)}
.lineage-section{max-width:920px;margin:0 auto 24px}
.lineage-toc{position:relative}
.toc-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.toc-grid>div{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:16px;box-shadow:0 8px 24px rgba(61,45,28,.04)}
.toc-grid h4{font-size:15px;color:var(--accent);margin-bottom:10px}
.toc-links{display:flex;flex-wrap:wrap;gap:8px}
.toc-links a{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--muted);font-size:12px;font-weight:750;text-decoration:none}
.toc-links.compact a{font-size:11px;min-height:30px;padding:0 9px}
.toc-links a:hover{border-color:var(--accent);color:var(--accent);background:var(--paper)}
.lineage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lineage-card,.figure-row,.lineage-note{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:18px;box-shadow:0 8px 24px rgba(61,45,28,.04)}
.lineage-card{position:relative;min-height:190px}
.lineage-num{font-size:12px;color:var(--accent2);font-weight:850;letter-spacing:2px;margin-bottom:10px}
.lineage-card h4{font-size:18px;color:var(--accent);line-height:1.35;margin-bottom:9px}
.lineage-card p,.figure-row p{font-size:14px;line-height:1.86;color:var(--muted);text-align:justify}
.figure-list{display:grid;gap:10px}
.figure-row{padding:0;scroll-margin-top:72px}
.lineage-card{scroll-margin-top:72px}
.figure-row summary{list-style:none;display:grid;grid-template-columns:minmax(180px,220px) minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 18px;cursor:pointer}
.figure-row summary::-webkit-details-marker{display:none}
.figure-row summary em{font-style:normal;font-size:12px;color:var(--muted);font-weight:800}
.figure-row[open] summary em{color:var(--accent)}
.figure-row[open] summary em:before{content:"收合";font-style:normal}
.figure-row[open] summary em{font-size:0}
.figure-row:not([open]) summary em:before{content:"展开";font-style:normal}
.figure-row:not([open]) summary em{font-size:0}
.figure-row strong{display:block;font-size:17px;color:var(--accent);line-height:1.35;margin-bottom:6px}
.figure-row span{display:block;font-size:12px;color:var(--accent2);font-weight:800;line-height:1.6}
.figure-copy{display:grid;gap:8px;padding:0 18px 18px 256px}
.figure-copy p{margin:0;padding-left:11px;border-left:2px solid color-mix(in srgb,var(--accent2),transparent 55%)}
.source-links{display:flex;flex-wrap:wrap;gap:8px}
.source-links a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--accent);font-size:13px;font-weight:750;text-decoration:none}
.source-links a:hover{border-color:var(--accent);background:var(--soft)}
.search-box{margin-bottom:14px}
.search-box input{width:100%;height:46px;padding:0 15px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--text);outline:none}
.search-box input:focus{border-color:var(--accent)}
#sc{display:grid;gap:8px}
.sr-item{width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);cursor:pointer;transition:border-color .16s,box-shadow .16s,transform .16s}
.sr-item:hover{border-color:var(--accent);box-shadow:0 8px 22px rgba(61,45,28,.05);transform:translateY(-1px)}
.sr-title{display:block;font-size:14px;font-weight:750;margin-bottom:4px;line-height:1.35}
.sr-snippet{display:block;font-size:13px;color:var(--muted);line-height:1.6}
.no-res{text-align:center;color:var(--muted);padding:32px}
.site-footer{max-width:980px;margin:0 auto;padding:10px 18px calc(96px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.site-footer p{padding-top:18px;border-top:1px solid color-mix(in srgb,var(--line),transparent 30%)}
.tab-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;min-height:64px;background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab-btn{flex:1;min-width:0;min-height:52px;border:none;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;line-height:1;cursor:pointer;transition:background .16s,color .16s,transform .16s}
.tab-btn .ui-icon{width:22px;height:22px;display:block;stroke-width:1.65}
.tab-btn span{display:block;line-height:1;white-space:nowrap}
.tab-btn:hover{background:color-mix(in srgb,var(--paper),transparent 32%)}
.tab-btn.active{color:var(--accent);font-weight:800;background:color-mix(in srgb,var(--accent),transparent 90%)}
@media(max-width:720px){
  #app{padding:18px 14px 18px}.app-title{font-size:40px}.stat-strip,.concept-grid,.lineage-grid,.toc-grid{grid-template-columns:1fr}
  .stat-strip button{border-right:none;border-bottom:1px solid var(--line)}.stat-strip button:last-child{border-bottom:none}
  .chapter-nav{display:grid;grid-template-columns:1fr 1fr}.chapter-nav button{width:100%;min-width:0;padding:0 10px}
  .concept-search{grid-template-columns:1fr}.concept-search span{justify-self:end}
  .top-row{display:block}.reader-shell{padding:18px 16px;box-shadow:0 10px 28px rgba(61,45,28,.06)}.detail-text{font-size:17px;line-height:2;text-align:left}
  .translation-card,.annot-card,.empty-note{margin:10px 0;padding:13px 14px}.translation-bd,.annot-bd,.empty-note p{text-align:left;line-height:1.86}
  .passage-block{padding:14px 0}.detail-text.passage{margin:5px 0 9px}
  .chapter-item{grid-template-columns:minmax(64px,auto) minmax(0,1fr) 28px;padding:12px 12px;column-gap:10px}.reader-tools{position:relative;margin-top:10px;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:0 2px 7px 0;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent),transparent 35%) transparent}.reader-tools::-webkit-scrollbar{height:4px}.reader-tools::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent),transparent 35%);border-radius:999px}.reader-tools label{flex:0 0 auto}.vs{max-width:190px}
  .reader-tools:after,.concepts-page .segmented:after{content:"›";position:sticky;right:0;z-index:2;flex:0 0 28px;width:28px;height:32px;margin-left:-8px;align-self:center;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--line),transparent 10%);border-radius:999px;background:color-mix(in srgb,var(--paper),transparent 5%);color:var(--accent);font-size:20px;font-weight:800;line-height:1;box-shadow:-12px 0 20px var(--bg)}
  .concepts-page .segmented{padding-right:2px;padding-bottom:9px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  .figure-row summary{grid-template-columns:1fr auto;gap:8px}.figure-copy{padding:0 16px 16px}
  .home-search-entry button{grid-template-columns:36px 1fr;gap:9px}.home-search-entry button>span:last-child{grid-column:2}
  .tab-bar{padding-left:6px;padding-right:6px}
  .tab-btn{font-size:11px;border-radius:10px;gap:3px}
  .tab-btn .ui-icon{width:21px;height:21px}
}
</style>
</head>
