 <!DOCTYPE html>
 <html lang="zh-CN">
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <meta name="theme-color" content="#f5f0eb">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="default">
 <link rel="manifest" href="manifest.json">
 <link rel="apple-touch-icon" href="icon.svg">
 <title>老庄智慧</title>
 <style>
 *{margin:0;padding:0;box-sizing:border-box}
 :root{--bg:#f5f0eb;--card:#fffdfa;--text:#2c2c2c;--text2:#6b6b6b;--accent:#8b2500;--border:#e8e0d5;--shadow:0 1px 4px rgba(0,0,0,.06);--radius:10px;--tab-hover:#f0ece6;--nav-bg:rgba(245,240,235,.92);--quote-bg:#ede6dc}
 body.dark{--bg:#1a1a1a;--card:#2a2a2a;--text:#e0e0e0;--text2:#999;--accent:#c0392b;--border:#3a3a3a;--shadow:0 1px 4px rgba(0,0,0,.3);--tab-hover:#333;--nav-bg:rgba(26,26,26,.92);--quote-bg:#333}
 body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
 .header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
 .header-title{font-size:18px;font-weight:600;letter-spacing:2px}
 .header-actions{display:flex;gap:8px}
 .icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--tab-hover);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
 .icon-btn:hover{background:var(--border)}
 #app{padding:16px 16px 80px;max-width:640px;margin:0 auto;min-height:calc(100vh - 120px)}
 .page{animation:fadeIn .3s ease}
 @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
 .page-title{font-size:22px;font-weight:600;margin-bottom:16px;letter-spacing:1px}
 .page-title .sub{font-size:14px;font-weight:400;color:var(--text2);letter-spacing:0}
 .hero-section{text-align:center;padding:32px 0 24px}
 .app-title{font-size:36px;font-weight:300;letter-spacing:12px;color:var(--accent);margin-bottom:8px}
 .app-subtitle{font-size:14px;color:var(--text2);letter-spacing:4px}
 .daily-card{background:var(--quote-bg);border-radius:var(--radius);padding:24px;text-align:center;margin:0 0 24px;box-shadow:var(--shadow)}
 .daily-label{font-size:12px;color:var(--text2);letter-spacing:4px;margin-bottom:12px}
 .daily-text{font-size:18px;line-height:1.7;font-weight:500;margin-bottom:8px}
 .daily-source{font-size:13px;color:var(--text2)}
 .quick-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
 .ql-btn{display:block;padding:14px 20px;background:var(--card);border-radius:var(--radius);text-decoration:none;color:var(--text);font-size:15px;font-weight:500;box-shadow:var(--shadow);cursor:pointer;transition:.2s;flex:1;text-align:center;min-width:120px;border:1px solid var(--border)}
 .ql-btn:hover{background:var(--tab-hover);transform:translateY(-1px)}
 .chapter-list{display:flex;flex-direction:column;gap:6px}
 .chapter-item{display:flex;align-items:center;padding:12px 14px;background:var(--card);border-radius:var(--radius);cursor:pointer;transition:.2s;border:1px solid var(--border);gap:10px}
 .chapter-item:hover{background:var(--tab-hover)}
 .ch-num{font-weight:600;font-size:15px;white-space:nowrap;min-width:60px;color:var(--accent)}
 .ch-preview{flex:1;font-size:14px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .ch-bookmark{cursor:pointer;font-size:18px;padding:4px;user-select:none}
 .detail-page{padding-top:0}
 .back-btn{background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer;padding:8px 0 12px;font-weight:500}
 .detail-title{font-size:20px;font-weight:600;margin-bottom:16px;color:var(--accent);letter-spacing:1px}
 .detail-text{font-size:16px;line-height:2;text-align:justify;padding:16px 0;font-family:"Songti SC","Noto Serif SC","STSong",Georgia,serif}
 .detail-text.passage{padding:12px 0;border-bottom:1px dashed var(--border)}
 .bm-btn{display:block;margin:20px auto 0;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:14px;cursor:pointer;transition:.2s}
 .bm-btn:hover{opacity:.85}
 .concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .concept-card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);box-shadow:var(--shadow)}
 .concept-card h3{font-size:18px;color:var(--accent);margin-bottom:8px;letter-spacing:2px}
 .concept-card p{font-size:13px;line-height:1.7;color:var(--text2)}
 .search-box{margin-bottom:16px}
 .search-box input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);font-size:15px;background:var(--card);color:var(--text);outline:none;transition:.2s}
 .search-box input:focus{border-color:var(--accent)}
 .no-res{color:var(--text2);text-align:center;padding:24px;font-size:14px}
 .sr-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:.2s}
 .sr-item:hover{background:var(--tab-hover)}
 .sr-title{font-weight:500;font-size:14px;margin-bottom:4px}
 .sr-snippet{font-size:13px;color:var(--text2)}
 .tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 0 env(safe-area-inset-bottom,6px)}
 .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:none;color:var(--text2);font-size:11px;cursor:pointer;transition:.2s;letter-spacing:1px}
 .tab-btn .tab-icon{font-size:20px;line-height:1}
 .tab-btn.active{color:var(--accent);font-weight:600}
 .tab-btn.active .tab-icon{transform:scale(1.1)}
 @media(max-width:420px){.concept-grid{grid-template-columns:1fr}.app-title{font-size:28px;letter-spacing:8px}.daily-text{font-size:16px}}
 @media(min-width:768px){#app{padding:24px 32px 80px}.app-title{font-size:42px}}
 </style>
 </head>
 <body>
 <header class="header">
   <div class="header-title">老庄智慧</div>
   <div class="header-actions">
     <button class="icon-btn" id="darkToggle" title="切换深色模式">🌓</button>
   </div>
 </header>
 <div id="app"></div>
 <nav class="tab-bar">
   <button class="tab-btn" data-tab="home"><span class="tab-icon">🏠</span>首页</button>
   <button class="tab-btn" data-tab="ddj"><span class="tab-icon">📖</span>道德经</button>
   <button class="tab-btn" data-tab="zz"><span class="tab-icon">🦋</span>庄子</button>
   <button class="tab-btn" data-tab="concepts"><span class="tab-icon">☯</span>概念</button>
   <button class="tab-btn" data-tab="search"><span class="tab-icon">🔍</span>搜索</button>
 </nav>
 <script src="data.js"></script>
 <script src="app.js"></script>
 </body>
 </html>
